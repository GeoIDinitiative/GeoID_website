  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved — the ten worlds are part of GeoHUB</title>
  <!--
    Planet Explorer is not a separate product any more: the ten worlds open in
    the same window as the GeoHUB globe, with the same tools, and the page
    that describes them is the GeoHUB page. This path stays because it is in
    bookmarks, shared links and search results; `canonical` points at the new
    home so the move is legible to a crawler, `noindex` keeps this from
    competing with it, and the link is there for anyone whose browser will
    not follow a refresh. A world opens inside GeoHUB, at
    /?world=<name>; the old standalone viewer paths bounce there too.
  -->
  <link rel="canonical" href="https://geoidinitiative.com/about_geohub/#worlds">
  <meta http-equiv="refresh" content="0; url=/about_geohub/#worlds">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/assets/GeoID_mark.png">
  <style>
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #040810;
      color: #c8dcec;
      font-family: "Public Sans", system-ui, -apple-system, sans-serif;
      text-align: center;
      line-height: 1.6;
    }
    a { color: #58c6b3; }
  </style>
</head>
<body>
  <main>
    <h1>The ten worlds are part of GeoHUB</h1>
    <p>Mercury to Pluto open in the same window as the Earth globe, with the same tools.</p>
    <p><a href="/about_geohub/#worlds">Continue to GeoHUB</a></p>
  </main>
  <script>window.location.replace("/about_geohub/#worlds");</script>
</body>
</html>
