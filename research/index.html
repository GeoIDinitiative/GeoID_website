<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved to GeoHUB — GeoID Initiative</title>
  <!--
    The Research Hub is part of GeoHUB now, at /geohub/, so this page has nothing of
    its own left to say. The stub stays because the path is in bookmarks, in
    shared links and in search results, and a removal that breaks those is a
    removal that loses people: `canonical` points at the new home so the move
    is legible to a crawler, `noindex` keeps this from competing with it, and
    the link is there for anyone whose browser will not follow a refresh.
  -->
  <link rel="canonical" href="https://geoidinitiative.com/geohub/">
  <meta http-equiv="refresh" content="0; url=/geohub/">
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07030f;
      color: #e8dcff;
      font: 400 1rem/1.6 system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    a { color: #ff2bd6; }
  </style>
</head>
<body>
  <main>
    <h1>The Research Hub is part of GeoHUB</h1>
    <p>Projects, ingest, analysis and figures now open in the same window as the globe.</p>
    <p><a href="/geohub/">Continue to GeoHUB</a></p>
  </main>
  <script>window.location.replace("/geohub/");</script>
</body>
</html>
