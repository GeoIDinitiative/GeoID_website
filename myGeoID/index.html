<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved to GeoHUB — GeoID Initiative</title>
  <!--
    The workspace this path served is now GeoHUB, at /. myGeoID is the
    name of the risk maps built inside it, not of the page.

    This stub stays because the old path is in bookmarks, in shared links and
    in search results, and a rename that breaks those is a rename that loses
    people. `canonical` points at the new page so the move is legible to a
    crawler rather than looking like duplicated content; the redirect is
    immediate, and the link is there for anyone whose browser will not follow
    a meta refresh.
  -->
  <link rel="canonical" href="https://geoidinitiative.com/">
  <meta http-equiv="refresh" content="0; url=/">
  <meta name="robots" content="noindex, follow">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07030f;
      color: #e8dcff;
      font: 400 1rem/1.6 system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    a { color: #ff2bd6; }
  </style>
</head>
<body>
  <main>
    <h1>This page is now GeoHUB</h1>
    <p>myGeoID is the risk mapping built inside it.</p>
    <p><a href="/">Continue to GeoHUB</a></p>
  </main>
  <script>window.location.replace("/" + window.location.hash);</script>
</body>
</html>
