<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard — GeoID Initiative</title>
  <!--
    THE DASHBOARD IS THE SITE ROOT. This path used to serve a second, different
    dashboard -- a planet carousel over a grid of hand-written news tiles --
    while the nav on the home page pointed "Dashboard" at `/` and the nav on
    every other page pointed it here. One label, two destinations, two designs:
    which one a reader got depended on the page they happened to click it from.

    All 33 of those links now point at `/`, and this stub stays because the old
    path is in bookmarks, in shared links and in anything already published.
    `canonical` points at the root so the move reads as a move rather than as
    duplicated content; the redirect is immediate, and the link is there for
    anyone whose browser will not follow a meta refresh.

    The page this replaced is not lost -- it is in the history:
        git show f6e2142628:dashboard/index.html
    Its planet carousel has no equivalent on the root page yet. If that is
    wanted, it is a section to lift across rather than a second dashboard to
    keep alive.
  -->
  <link rel="canonical" href="https://geoidinitiative.com/">
  <meta http-equiv="refresh" content="0; url=/">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/png" href="/assets/GeoID_mark.png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #07030f;
      color: #e8dcff;
      font: 400 1rem/1.6 system-ui, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    a { color: #ff2bd6; }
  </style>
</head>
<body>
  <main>
    <h1>The dashboard is the home page</h1>
    <p>There is one dashboard now, and it is at the front of the site.</p>
    <p><a href="/">Continue to the dashboard</a></p>
  </main>
  <script>window.location.replace("/" + window.location.hash);</script>
</body>
</html>
