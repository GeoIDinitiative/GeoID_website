<!DOCTYPE html>
<html lang="en">
<head>
  <!-- An internal hand-off, not a page: opened top-level it bounces into the
       shell. It must be crawlable (or the noindex below is never read) and it
       must not be indexed. -->
  <meta name="robots" content="noindex, follow">
  <!-- OPENED TOP-LEVEL, THIS PAGE IS AN OLD LINK. The live site reaches every
       world through the GeoHUB shell, which holds this page in its frame and
       gives the viewer its header, its mode bar and its theme. A viewer
       reached without the shell is the same file with none of that -- the
       "defunct" planet viewer a reader lands in from a stale bookmark or a
       search result. So a top-level transit goes into the shell with the
       destination it was asked for, and the shell loads this page again,
       embedded, where it belongs. First in <head>, so nothing is fetched or
       painted on the way out. -->
  <script>
    (function () {
      if (window.self !== window.top) return;
      var WORLDS = ["mercury", "venus", "moon", "mars", "jupiter", "saturn", "uranus", "neptune", "pluto"];
      var dest = "";
      try { dest = (new URLSearchParams(window.location.search).get("destination") || "mars").toLowerCase(); } catch (_e) {}
      window.location.replace(WORLDS.indexOf(dest) === -1 ? "/" : "/?world=" + dest);
    })();
  </script>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'sha256-gqZervCh0LjknXcRuRgppk1ee0wxzaJQKYND0hWU29k=' 'sha256-j6BQ3L85G/dGtMGH9O+MTPHT5R9QgT93ihyXVsAWwpY=' 'sha256-rDdYEm63cRodo0Pct49R3DJzYsrko6oYkWHIvG0U4Wc='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; media-src 'self' data: blob: https:; connect-src 'self' data: blob: https: http://localhost:* http://127.0.0.1:*; frame-src 'self' blob: https://docs.google.com https://drive.google.com; form-action 'self' https://formspree.io https://buy.stripe.com https://docs.google.com; worker-src 'self' blob:; child-src 'self' blob:; upgrade-insecure-requests">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GeoID: Explorer | Transit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@300;400;500;600&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Retired site-wide; re-pointed so the transit screen matches the
       viewers it launches into. */
    @font-face {
      font-family: "Orbitron";
      font-style: normal; font-weight: 100 900; font-display: swap;
      src: url(https://fonts.gstatic.com/s/audiowide/v22/l7gdbjpo0cum0ckerWCdlg_O.woff2) format('woff2');
    }
    @font-face {
      font-family: "Exo 2";
      font-style: normal; font-weight: 400; font-display: swap;
      src: url(https://fonts.gstatic.com/s/chakrapetch/v13/cIf6MapbsEk7TDLdtEz1BwkWn6pg.woff2) format('woff2');
    }
    @font-face {
      font-family: "Exo 2";
      font-style: normal; font-weight: 500 900; font-display: swap;
      src: url(https://fonts.gstatic.com/s/chakrapetch/v13/cIflMapbsEk7TDLdtEz1BwkeQI51R5_F.woff2) format('woff2');
    }

    :root {
      --text: #fdf7ff;
      --muted: rgba(214, 194, 255, 0.78);
      --accent: #ff2bd6;
      --blue: #00e5ff;
      --border: rgba(255, 43, 214, 0.22);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    /* Space is black, and the page is a screen, not a document. */
    body { overflow: hidden; background: #030608; color: var(--text); font-family: "Exo 2", "Trebuchet MS", sans-serif; }

    /* THE LAYERS, back to front: the chart, stars, Earth and flybys; the
       destination viewer (scaled up from a point for the arrival); the flare
       that crosses it; the words. */
    #tx-back, #tx-front { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #tx-back { z-index: 0; }
    #viewer-frame { z-index: 1; }
    #tx-front { z-index: 3; }
    /* The words, brackets and bar are drawn on #tx-front by transit-render.js
       (off the main thread); this line is what a screen reader hears. */
    .tx-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    /* The two things a reader can do: go home, or get there now. */
    #tx-actions { position: fixed; right: calc(34px * max(0.6, var(--u, 1)) + 20px); bottom: calc(34px * max(0.6, var(--u, 1)) + 14px); z-index: 5; display: flex; gap: 10px; transition: opacity .4s; }
    #tx-actions a, #tx-actions button { font: 500 11px "Exo 2", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.6); background: rgba(3,6,8,.5); border: 1px solid rgba(255,255,255,.18); padding: 6px 12px; cursor: pointer; text-decoration: none; }
    #tx-actions a:hover, #tx-actions button:hover, #tx-actions a:focus-visible, #tx-actions button:focus-visible { color: #fff; border-color: #f7bd68; outline: none; }
    /* ── Portrait orientation advisory ───────────────────────────────── */
    #portrait-advisory { display: none; }

    @media (orientation: portrait) and (pointer: coarse) {
      #portrait-advisory {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        position: fixed;
        inset: 0;
        z-index: 9000;
        background: rgba(0, 6, 14, 0.92);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        padding: 2rem;
        text-align: center;
        color: #fdf7ff;
      }
      #portrait-advisory.is-dismissed { display: none; }
      #portrait-advisory-icon {
        width: 6rem;
        height: 6rem;
        filter: invert(1) sepia(1) hue-rotate(185deg) saturate(1.6) brightness(1.3);
        animation: tilt-hint 1.8s ease-in-out infinite;
      }
      @keyframes tilt-hint {
        0%, 100% { transform: rotate(-15deg); }
        50%       { transform: rotate(15deg); }
      }
      #portrait-advisory-text {
        font-size: 1.1rem;
        font-weight: 500;
        letter-spacing: 0.03em;
        color: #c8e8ff;
        max-width: 20rem;
        line-height: 1.5;
      }
      #portrait-advisory-dismiss {
        margin-top: 0.5rem;
        padding: 0.55rem 1.6rem;
        border-radius: 2rem;
        border: 1px solid rgba(0, 229, 255, 0.35);
        background: rgba(0, 229, 255, 0.1);
        color: #00e5ff;
        font-size: 0.85rem;
        font-family: inherit;
        cursor: pointer;
        letter-spacing: 0.06em;
        transition: background 0.2s, border-color 0.2s;
      }
      #portrait-advisory-dismiss:hover,
      #portrait-advisory-dismiss:focus-visible {
        background: rgba(0, 229, 255, 0.2);
        border-color: rgba(0, 229, 255, 0.6);
        outline: none;
      }
    }
  /* GeoID-force-landscape: in portrait, hide the dismiss button and
         the is-dismissed escape so the user must rotate the device. */
      @media (orientation: portrait) and (pointer: coarse) {
        #portrait-advisory-dismiss { display: none !important; }
        #portrait-advisory.is-dismissed { display: flex !important; }
      }
        </style>
</head>
<body>
  <canvas id="tx-back" aria-hidden="true"></canvas>
  <iframe id="viewer-frame" src=""
    style="position:fixed;inset:0;width:100%;height:100%;border:none;opacity:0;pointer-events:none;background:#000;display:none;"
    allow="fullscreen"></iframe>
  <canvas id="tx-front" aria-hidden="true"></canvas>

  <p id="tx-sr" class="tx-sr" aria-live="polite"></p>
  <div id="tx-actions">
    <a href="/" target="_top" rel="home">← Home</a>
    <button type="button" id="tx-skip">Skip ›</button>
  </div>

  <script src="transit-render.js?v=20260925-40bf2a5"></script>
  <script src="transit-sequence.js?v=20260925-40bf2a5"></script>
  <script>
    const destinations = {
      mercury: {
        name: "Mercury", km: 91600000, lightYears: 0.00000968, etaDays: 147,
        target: "/planet_explorer/mercury/viewer/",
        shot: "/assets/hero/mercury.jpg",
        icon: "/assets/mercury_icon.png"
      },
      venus: {
        name: "Venus", km: 41400000, lightYears: 0.00000438, etaDays: 109,
        target: "/planet_explorer/venus/viewer/",
        shot: "/assets/hero/venus.jpg",
        icon: "/assets/venus_icon.png"
      },
      earth: {
        name: "ISS", subtitle: "International Space Station",
        km: 408, lightYears: 0.0000000000431, etaDays: 0.25,
        target: "/earth_explorer/",
        shot: "/assets/hero/earth.jpg",
        icon: "/assets/ISS_icon.png", originLabel: "Earth"
      },
      moon: {
        name: "Moon", km: 384400, lightYears: 0.0000000406, etaDays: 3,
        target: "/planet_explorer/moon/viewer/",
        shot: "/assets/hero/moon.jpg",
        icon: "/assets/moon_icon.png", originLabel: "Earth"
      },
      mars: {
        name: "Mars", km: 225000000, lightYears: 0.000024, etaDays: 222,
        target: "/planet_explorer/mars/viewer/index.html",
        shot: "/assets/hero/mars.jpg",
        icon: "/assets/mars_icon.png"
      },
      jupiter: {
        name: "Jupiter", km: 628700000, lightYears: 0.00006645, etaDays: 730,
        target: "/planet_explorer/jupiter/viewer/",
        shot: "/assets/hero/jupiter.jpg",
        icon: "/assets/jupiter_icon.png"
      },
      saturn: {
        name: "Saturn", km: 1275000000, lightYears: 0.00013475, etaDays: 2555,
        target: "/planet_explorer/saturn/viewer/",
        shot: "/assets/hero/saturn.jpg",
        icon: "/assets/saturn_icon.png"
      },
      uranus: {
        name: "Uranus", km: 2724000000, lightYears: 0.0002879, etaDays: 3285,
        target: "/planet_explorer/uranus/viewer/",
        shot: "/assets/hero/uranus.jpg",
        icon: "/assets/uranus_icon.png"
      },
      neptune: {
        name: "Neptune", km: 4351000000, lightYears: 0.00045983, etaDays: 4380,
        target: "/planet_explorer/neptune/viewer/",
        shot: "/assets/hero/neptune.jpg",
        icon: "/assets/neptune_icon.png"
      },
      pluto: {
        name: "Pluto", km: 5906000000, lightYears: 0.000624, etaDays: 5840,
        target: "/planet_explorer/pluto/viewer/",
        shot: "/assets/hero/pluto.jpg",
        icon: "/assets/pluto_icon.png"
      }
    };

    const params = new URLSearchParams(window.location.search);
    const destKey = (params.get("destination") || "mars").toLowerCase();
    const dest = destinations[destKey] || destinations.mars;
    const key = destinations[destKey] ? destKey : "mars";
    document.title = `GeoID: Transit · ${dest.name}`;

    const viewerFrame = document.getElementById("viewer-frame");
    const actions = document.getElementById("tx-actions");
    const CROSSFADE_MS = 400;

    /**
     * THE HOST HANDSHAKE HAS TO PASS THROUGH THIS PAGE.
     *
     * Inside GeoHUB the frames nest twice: the shell holds this page, and this
     * page holds the destination viewer. The shell posts `geoid:modebar-host`
     * to its DIRECT child -- which is this page, not the viewer -- so the
     * viewer never heard it and never set `modebar-hosted`. Measured on Mars
     * through this route: `viewer-page is-embedded` with the hosted class
     * absent, so the page drew its own project/music/settings row and its
     * audio credit while the shell's header drew the same controls above it.
     * Two decks, which is what a reader sees as the viewer being broken.
     * Reached directly the same viewer is `viewer-page is-embedded
     * modebar-hosted audio-hosted` and correct, which is what isolated it.
     *
     * So this page is a wire, not a participant: anything `geoid:`-prefixed
     * from the shell goes down to the viewer, and anything from the viewer
     * goes up to the shell. It never answers a message itself, so there is no
     * loop -- each direction posts only to the opposite window -- and it does
     * not need to know the protocol, which is the point: `-host`, `-press`,
     * `-ready`, `-gone`, `geoid:resize` and whatever is added next all cross
     * without this file being touched again.
     */
    (function relayGeoIDMessages() {
      const hosted = window.parent && window.parent !== window;
      window.addEventListener("message", (event) => {
        const data = event.data;
        const type = data && data.type;
        if (typeof type !== "string" || !type.startsWith("geoid:")) return;
        const inner = viewerFrame.contentWindow;
        if (hosted && event.source === window.parent) {
          try { inner?.postMessage(data, "*"); } catch (_e) {}
        } else if (inner && event.source === inner && hosted) {
          try { window.parent.postMessage(data, "*"); } catch (_e) {}
        }
      });
    })();
    const targetUrl = dest.target + (dest.target.includes("?") ? "&" : "?") + "transit=1";

    // Start preloading the viewer — but NOT while the rotate advisory is up.
    //
    // In portrait on a phone this page shows a full-screen, undismissable
    // "rotate your device" overlay, and the viewer it is about to load shows
    // its own. Preloading anyway meant a whole WebGL viewer booted and
    // allocated its textures behind that overlay, then had to resize its
    // canvas and framebuffers the moment the user actually rotated — the
    // worst possible moment on a memory-constrained device, and the point
    // where the two screens appeared to fight each other. Defer until the
    // device is in the orientation the viewer is designed for.
    const isBlockedPortrait = () => {
      try {
        return window.matchMedia("(orientation: portrait) and (pointer: coarse)").matches;
      } catch (_e) { return false; }
    };
    let viewerPreloadStarted = false;
    function startViewerPreload() {
      if (viewerPreloadStarted || isBlockedPortrait()) return;
      viewerPreloadStarted = true;
      viewerFrame.src = targetUrl;
    }
    startViewerPreload();
    if (!viewerPreloadStarted) {
      // matchMedia change fires on rotation; the orientationchange fallback
      // covers browsers that report the new orientation late.
      try {
        window.matchMedia("(orientation: portrait)")
          .addEventListener("change", () => setTimeout(startViewerPreload, 60));
      } catch (_e) {}
      window.addEventListener("orientationchange",
        () => setTimeout(startViewerPreload, 60));
    }

    function revealViewer() {
      startViewerPreload();
      viewerFrame.style.display = "block";
      // The flag as well as the message. A message is heard only by a
      // listener that already exists, and a viewer still loading its textures
      // at the reveal has not registered one yet -- it then waited for a
      // reveal that had already been sent, and the globe stayed black for good
      // (measured on Neptune). The viewers read this flag first.
      window._geoidReveal = true;
      try { viewerFrame.contentWindow.postMessage("geoid-reveal", "*"); } catch (_) {}
      // A viewer that initialised while this frame was display:none sized its
      // renderer from a zero viewport; tell it once the frame has a layout,
      // and again when its loop says it has started.
      const nudgeResize = () => requestAnimationFrame(() => {
        try { viewerFrame.contentWindow.dispatchEvent(new Event("resize")); } catch (_) {}
      });
      nudgeResize();
      window.addEventListener("message", function onReady(event) {
        if (event.data !== "geoid-ready" || event.source !== viewerFrame.contentWindow) return;
        window.removeEventListener("message", onReady);
        nudgeResize();
      });
    }

    // WAIT FOR A DRAWN FRAME, not for "geoid-ready": that message means
    // "about to draw". The frame is same-origin, so this can look: a globe, a
    // texture on it, and at least one frame rendered.
    function viewerHasDrawn() {
      try {
        const w = viewerFrame.contentWindow;
        const v = w && w.GeoIDViewer;
        if (!v || !v.globe || !v.renderer) return false;
        if (!(v.renderer.info.render.frame > 0)) return false;
        // And the GIS layer has to have stopped rearranging itself, or the
        // card lifts on a panel that is about to reshuffle three times.
        // A destination that never runs that bootstrap — Earth loads its
        // modules as its own script tags — leaves the flag undefined,
        // which is not pending and so does not hold anything up.
        if (w.GeoIDGisPending) return false;
        let textured = false;
        v.globe.traverse((o) => {
          const m = o.material;
          for (const mat of Array.isArray(m) ? m : [m]) if (mat && mat.map) textured = true;
        });
        return textured;
      } catch (_e) {
        return true;   // cannot see in; never hold the page on that
      }
    }

    /**
     * The globe's radius as a fraction of the frame's height, read off the
     * viewer's own camera: the brackets close onto the planet at the size the
     * viewer draws it. Measured fallbacks where the camera is not reachable.
     */
    function globeFraction() {
      try {
        const w = viewerFrame.contentWindow, v = w.GeoIDViewer;
        const cam = v.camera || (w.__flightSimHooks && w.__flightSimHooks.camera);
        const globe = v.globe;
        if (cam && cam.isPerspectiveCamera && globe) {
          if (!globe.geometry.boundingSphere) globe.geometry.computeBoundingSphere();
          const c = globe.getWorldPosition(new globe.position.constructor());
          const scale = globe.getWorldScale(new globe.position.constructor()).x;
          const R = globe.geometry.boundingSphere.radius * scale, d = cam.position.distanceTo(c);
          if (d > R) return Math.tan(Math.asin(R / d)) / Math.tan((cam.fov * Math.PI / 180) / 2) / 2;
        }
      } catch (_e) {}
      return { mars: 0.3465, saturn: 0.2115 }[key] || 0.3;
    }

    /**
     * THE VIEWER'S PANELS WAIT FOR THE ARRIVAL. The approach shows the
     * viewer through a circle about its globe, and a ringed planet's circle
     * is wide enough to take in the edge of the viewer's sidebar. So while it
     * arrives, everything on its page that does not hold the globe's canvas
     * is hidden, and it comes back as the circle opens.
     */
    function viewerChrome(show) {
      try {
        const d = viewerFrame.contentDocument;
        if (!d || !d.body) return;
        if (!d.getElementById("tx-arriving-style")) {
          const st = d.createElement("style");
          st.id = "tx-arriving-style";
          st.textContent = "body.tx-arriving > *:not(:has(canvas)):not(script):not(style) { visibility: hidden !important; }";
          d.head.appendChild(st);
        }
        d.body.classList.toggle("tx-arriving", !show);
      } catch (_e) {}
    }

    let crossed = false;
    function crossover() {
      if (crossed) return; crossed = true;
      viewerChrome(true);
      viewerFrame.style.transition = `opacity ${CROSSFADE_MS}ms ease`;
      viewerFrame.style.opacity = "1";
      // What the GeoHUB shell reads as "transit has handed over".
      viewerFrame.dataset.crossed = "1";
      viewerFrame.style.zIndex = "6";
      for (const id of ["tx-back", "tx-front"]) {
        const el = document.getElementById(id);
        if (!el) continue;
        el.style.transition = `opacity ${CROSSFADE_MS}ms ease`; el.style.opacity = "0";
      }
      actions.style.opacity = "0"; actions.style.pointerEvents = "none";
      setTimeout(() => { viewerFrame.style.pointerEvents = "auto"; }, CROSSFADE_MS);
    }

    /**
     * THE SHORT WAY IN. Under the GeoHUB start screen (a cold `/?world=`),
     * nobody can see a sequence, and with reduced motion nobody wants one:
     * the viewer is revealed at once and handed over the moment it has drawn.
     */
    function booting() {
      try { return window.parent !== window && window.parent.document.documentElement.classList.contains("is-booting"); }
      catch (_e) { return false; }
    }
    const reduced = (() => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (_e) { return false; } })();

    const arrival = new Date(Date.now() + dest.etaDays * 86400000);
    const arrivalText = dest.etaDays < 1
      ? arrival.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
      : arrival.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });

    if (booting() || reduced) {
      revealViewer();
      viewerFrame.style.opacity = "0";
      const deadline = performance.now() + 9000;
      (function wait() {
        if (viewerHasDrawn() || performance.now() > deadline) { crossover(); return; }
        requestAnimationFrame(wait);
      })();
    } else {
      window.GeoIDTransitSequence.start({
        key, name: dest.name, km: dest.km, etaDays: dest.etaDays, etaText: formatEta(dest.etaDays).replace(/, /g, " · "),
        arrivalText,
        icons: Object.fromEntries(Object.entries(destinations).map(([k, d]) => [k, d.icon])),
        hooks: { frame: viewerFrame, reveal: revealViewer, viewerDrawn: viewerHasDrawn, globeFraction, crossover, chrome: viewerChrome },
      });
    }

    function formatEta(totalDays) {
      if (totalDays < 1) {
        const h = Math.round(totalDays * 24);
        return `~${h} hour${h === 1 ? "" : "s"}`;
      }
      let rem = totalDays;
      const years  = Math.floor(rem / 365); rem -= years * 365;
      const months = Math.floor(rem / 30);  rem -= months * 30;
      const days   = rem;
      const parts  = [];
      if (years)  parts.push(`${years} ${years  === 1 ? "year"  : "years"}`);
      if (months) parts.push(`${months} ${months === 1 ? "month" : "months"}`);
      if (days || !parts.length) parts.push(`${days} ${days === 1 ? "day" : "days"}`);
      return parts.join(", ");
    }
  </script>

  <div id="portrait-advisory" role="status" aria-live="polite">
    <img src="/assets/tilt_phone.png" alt="Rotate device" id="portrait-advisory-icon" loading="lazy" decoding="async">
    <p id="portrait-advisory-text">Rotate to landscape for the best experience</p>
    <button id="portrait-advisory-dismiss" type="button" aria-label="Dismiss">Got it</button>
  </div>
  <script>
    (function () {
      var advisory = document.getElementById("portrait-advisory");
      var dismissBtn = document.getElementById("portrait-advisory-dismiss");
      if (!advisory || !dismissBtn) return;
      dismissBtn.addEventListener("click", function () {
        advisory.classList.add("is-dismissed");
      });
      window.addEventListener("orientationchange", function () {
        advisory.classList.remove("is-dismissed");
      });
    })();
  </script>
</body>
</html>
