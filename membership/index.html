<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Paid membership is withdrawn. Every viewer is free with a free account,
       so this route now forwards to /account/ rather than showing a checkout.
       The full membership page is in git history (commit 8ceb32a) if a paid
       tier is ever reinstated. -->
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="0; url=/account/">
  <link rel="canonical" href="/account/">
  <title>Redirecting — GeoID</title>
  <script>
    // Preserve any query string (e.g. ?need=signin&return=…) so a redirect
    // through here doesn't lose where the visitor was heading. replace() keeps
    // this hop out of the back-button history.
    window.location.replace("/account/" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #060410;
      color: #c3d8f5;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
      text-align: center;
      padding: 2rem;
    }
    a { color: #58c6b3; }
  </style>
</head>
<body>
  <p>
    GeoID Explorer is free to use.
    Taking you to <a href="/account/">your account</a>…
  </p>
</body>
</html>
