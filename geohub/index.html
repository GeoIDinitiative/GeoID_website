<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoHUB — GeoID Initiative</title>
  <!--
    GeoHUB is the site's front door now: the shell that lived here is / and
    the dashboard that lived at / is /dashboard/. This path stays because it
    is in bookmarks, in shared links, in the planet viewers' guards and in
    search results, and a rename that breaks those is a rename that loses
    people. The query string and the hash travel with the redirect, so
    /geohub/?world=mars still opens Mars.
  -->
  <link rel="canonical" href="https://geoidinitiative.com/">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="refresh" content="0; url=/">
  <link rel="icon" type="image/png" href="/assets/GeoID_mark.png">
  <style>
    html { color-scheme: dark; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 2rem; background: #040810; color: #c8dcec; font-family: "Public Sans", system-ui, -apple-system, sans-serif; text-align: center; line-height: 1.6; }
    a { color: #58c6b3; }
  </style>
</head>
<body>
  <main>
    <h1>GeoHUB is the front page now</h1>
    <p><a href="/">Continue to GeoHUB</a></p>
  </main>
  <script>window.location.replace("/" + window.location.search + window.location.hash);</script>
</body>
</html>
