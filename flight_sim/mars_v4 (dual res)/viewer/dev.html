<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starting Mars viewer (clean)…</title>
<style>
  html,body{height:100%;margin:0;background:#0a0e16;color:#dce9f7;
    font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex;align-items:center;justify-content:center}
  .box{max-width:34rem;padding:2rem}
  h1{font-size:1.05rem;font-weight:600;letter-spacing:.02em;margin:0 0 1rem}
  ol{margin:0;padding-left:1.2rem}
  li{margin:.35rem 0;opacity:.45;transition:opacity .2s}
  li.done{opacity:1}
  li.done::marker{content:"✓ "}
  .err{color:#ff9a8a;margin-top:1rem;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <h1>Starting the Mars viewer with a clean slate…</h1>
  <ol>
    <li id="s1">Unregistering service workers</li>
    <li id="s2">Deleting all caches</li>
    <li id="s3">Clearing localStorage / sessionStorage</li>
    <li id="s4">Registering the CTX tile worker and waiting for it to take control</li>
    <li id="s5">Opening the viewer</li>
  </ol>
  <div class="err" id="err"></div>
</div>
<script>
// DEV-ONLY launcher. Guarantees the viewer starts with no stale service worker,
// no cached tiles/assets, and no cached CTX service config — and, crucially,
// with the CTX tile worker ALREADY controlling the page.
//
// Why that last part matters: the viewer registers sw-ctx-tiles.js from inside
// mars-viewer.js, but loadCtxServiceConfig() runs earlier in boot. On a first
// load nothing is controlling the page yet, so the /ctx-proxy/service probe
// 404s, the viewer falls back to the direct ArcGIS endpoint, and that result is
// cached in localStorage for 24 h. Pre-registering here removes that race, so
// the proxy route (and therefore tile caching) is live from the first frame.
const step = (id) => document.getElementById(id).classList.add("done");

(async () => {
  try {
    if ("serviceWorker" in navigator) {
      for (const r of await navigator.serviceWorker.getRegistrations()) await r.unregister();
    }
    step("s1");

    if (window.caches) {
      for (const k of await caches.keys()) await caches.delete(k);
    }
    step("s2");

    localStorage.clear();
    sessionStorage.clear();
    step("s3");

    // Registered at /flight_sim/ so its scope covers this page AND the viewer.
    // Scope limits which PAGES the worker controls, not which URLs it may
    // intercept — so it still handles the root-level /ctx-proxy/ requests.
    if ("serviceWorker" in navigator) {
      await navigator.serviceWorker.register("/flight_sim/sw-ctx-tiles.js", { scope: "/flight_sim/" });
      await navigator.serviceWorker.ready;
    }
    step("s4");

    step("s5");
    // Cache-busted so the browser can never serve a stale index.html.
    location.replace("./?fresh=" + Date.now());
  } catch (e) {
    document.getElementById("err").textContent =
      "Setup failed: " + (e && e.message ? e.message : e) +
      "\nOpening the viewer anyway…";
    setTimeout(() => location.replace("./?fresh=" + Date.now()), 2500);
  }
})();
</script>
</body>
</html>
