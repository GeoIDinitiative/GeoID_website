<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — GeoID Initiative</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/GeoID_logo_icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=Inter:wght@400..700&display=swap" rel="stylesheet">
  <!-- Self-contained on purpose: a 404 can be served for any path, so it
       must not depend on the site's shared CSS being reachable/cached. -->
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 28px;
      background:
        radial-gradient(90rem 50rem at 80% -10%, rgba(255,62,200,0.08), transparent 60%),
        #0d0221;
      color: #f2f5f8;
      font-family: "Inter", system-ui, sans-serif;
      text-align: center;
      padding: 32px;
    }
    .code {
      font-family: "Archivo", sans-serif;
      font-size: clamp(5rem, 18vw, 11rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255,255,255,0.25);
    }
    h1 {
      margin: 0;
      font-family: "Archivo", sans-serif;
      font-size: clamp(1.4rem, 3.4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    p { margin: 0; max-width: 34rem; line-height: 1.65; color: rgba(235,242,248,0.6); font-size: 15px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      height: 46px; padding: 0 22px;
      border-radius: 2px;
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.06em; text-transform: uppercase;
      text-decoration: none;
      transition: background .25s, color .25s, border-color .25s;
    }
    .solid { background: #fff; border: 1px solid #fff; color: #08090b; }
    .solid:hover { background: #ff3ec8; border-color: #ff3ec8; color: #2b0030; }
    .line { background: none; border: 1px solid rgba(255,255,255,0.22); color: #f2f5f8; }
    .line:hover { border-color: #fff; background: rgba(255,255,255,0.06); }
    .foot { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(235,242,248,0.35); }
  </style>
</head>
<body>
  <div class="code">404</div>
  <h1>This page has drifted off the map.</h1>
  <p>The address may have changed in the redesign, or it never existed. Everything that matters is still charted below.</p>
  <div class="row">
    <a class="btn solid" href="/">Back to the dashboard</a>
    <a class="btn line" href="/explorer/">Planet Explorer</a>
    <a class="btn line" href="/earth_explorer/">Earth Explorer</a>
    <a class="btn line" href="/contact/">Contact</a>
  </div>
  <span class="foot">GeoID Initiative · geoidinitiative.com</span>
</body>
</html>
