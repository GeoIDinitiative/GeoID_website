<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — GeoID</title>
  <link rel="icon" type="image/png" href="/assets/GeoID_logo_icon.png">
  <meta name="robots" content="noindex,nofollow">
  <script>
    // /sign-in/ has been merged into /account/. Preserve any incoming
    // ?return=… and ?need=… query params so callers (paywall guard,
    // legacy nav buttons) still route correctly.
    (function () {
      const search = window.location.search || "";
      window.location.replace("/account/" + search);
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/account/">
  </noscript>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;text-align:center;padding:4rem 1rem;color:#888;">
    Redirecting to <a href="/account/" style="color:#58c6b3;">/account/</a>…
  </p>
</body>
</html>
