<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Sign in to your GeoID membership.">
  <title>Sign In — GeoID</title>
  <link rel="icon" type="image/png" href="/assets/GeoID_logo_icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Public+Sans:wght@400;500;600;700&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/shared.css">
  <style>
    /* Small-viewport adjustments — the auth card hugs the screen edge instead of overflowing. */
    @media (max-width: 520px) {
      .auth-shell, .membership-page, .account-page { padding-left: 0.75rem !important; padding-right: 0.75rem !important; padding-top: 5rem !important; }
      .auth-card, .checkout-card, .account-card { padding: 1.4rem 1rem 1.2rem !important; border-radius: 0.9rem !important; }
      .checkout-card-grid { grid-template-columns: 1fr !important; gap: 1.2rem !important; }
      .auth-brand { gap: 0.4rem !important; }
      .auth-brand-text { display: none !important; }
    }
    body {
      /* Sign-in artwork as the page backdrop, with a dimming overlay so the
         glass auth card stays legible against any photographic content. */
      background:
        linear-gradient(180deg, rgba(6, 4, 16, 0.78) 0%, rgba(6, 4, 16, 0.86) 60%, rgba(4, 3, 9, 0.92) 100%),
        url('/assets/sign_in.png') center / cover no-repeat fixed,
        #060410;
      color: #e6ecf2;
      font-family: "Public Sans", sans-serif;
      min-height: 100dvh;
    }
    .auth-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 6rem 1.5rem 4rem;
    }
    /* Large GeoID wordmark anchored top-right of the page. */
    .auth-brand {
      position: fixed;
      top: 1.5rem;
      right: 2rem;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      pointer-events: auto;
    }
    .auth-brand-icon {
      width: 4.2rem;
      height: 4.2rem;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.55));
    }
    .auth-brand-text {
      display: flex;
      flex-direction: column;
      line-height: 1.05;
    }
    .auth-brand-wordmark {
      font-family: "Archivo", "Public Sans", sans-serif;
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      color: #e8f7f4;
      text-shadow: 0 2px 14px rgba(0,0,0,0.55);
    }
    .auth-brand-wordmark span { color: #58c6b3; }
    .auth-brand-tag {
      margin-top: 0.18rem;
      font-family: "Orbitron", "Exo 2", sans-serif;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(88, 198, 179, 0.85);
    }
    @media (max-width: 720px) {
      .auth-brand { top: 1rem; right: 1rem; gap: 0.6rem; }
      .auth-brand-icon { width: 3rem; height: 3rem; }
      .auth-brand-wordmark { font-size: 1.4rem; }
      .auth-brand-tag { font-size: 0.55rem; }
    }

    /* ── Auth card — cyan/dark-blue theme matching shared.css ── */
    .auth-card {
      width: 100%;
      max-width: 26rem;
      background: linear-gradient(160deg, rgba(9, 26, 38, 0.94), rgba(5, 13, 20, 0.94));
      border: 1px solid rgba(88, 198, 179, 0.28);
      border-radius: 1.1rem;
      padding: 2rem 1.8rem 1.6rem;
      box-shadow:
        0 22px 60px rgba(0, 0, 0, 0.55),
        0 0 0 1px rgba(88, 198, 179, 0.06),
        0 0 32px rgba(88, 198, 179, 0.08);
    }
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem;
      padding: 0.25rem;
      background: rgba(88, 198, 179, 0.06);
      border: 1px solid rgba(88, 198, 179, 0.14);
      border-radius: 0.5rem;
      margin-bottom: 1.4rem;
    }
    .auth-tab {
      padding: 0.55rem 0.5rem;
      text-align: center;
      font-family: "Public Sans", "Source Sans 3", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(154, 184, 189, 0.78);
      background: transparent;
      border: 0;
      border-radius: 0.4rem;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .auth-tab.is-active {
      background: rgba(88, 198, 179, 0.18);
      color: #e8f7f4;
      box-shadow: inset 0 0 0 1px rgba(88, 198, 179, 0.4);
    }
    .auth-title {
      font-family: "Archivo", "Public Sans", sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 0.35rem;
      color: #e8f7f4;
    }
    .auth-sub {
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 0.9rem;
      color: rgba(154, 184, 189, 0.95);
      margin: 0 0 1.3rem;
    }
    .auth-field {
      display: flex;
      flex-direction: column;
      gap: 0.32rem;
      margin-bottom: 0.85rem;
    }
    .auth-field label {
      font-family: "Public Sans", "Source Sans 3", sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(88, 198, 179, 0.85);
    }
    .auth-field input {
      width: 100%;
      padding: 0.7rem 0.85rem;
      background: rgba(5, 14, 22, 0.7);
      border: 1px solid rgba(88, 198, 179, 0.22);
      border-radius: 0.5rem;
      color: #e8f7f4;
      font: inherit;
      font-family: "Source Sans 3", "Segoe UI", sans-serif;
      font-size: 0.95rem;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }
    .auth-field input:focus {
      outline: none;
      border-color: rgba(88, 198, 179, 0.7);
      background: rgba(8, 22, 32, 0.85);
      box-shadow: 0 0 0 3px rgba(88, 198, 179, 0.18);
    }
    .auth-submit {
      display: block;
      width: 100%;
      margin-top: 0.5rem;
      padding: 0.85rem 1.1rem;
      font-family: "Public Sans", "Source Sans 3", sans-serif;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: linear-gradient(180deg, rgba(88, 198, 179, 0.28), rgba(32, 122, 110, 0.32));
      color: #e8f7f4;
      border: 1px solid rgba(88, 198, 179, 0.55);
      border-radius: 0.55rem;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(32, 122, 110, 0.22);
      transition: transform 0.12s ease, background 0.18s ease, opacity 0.15s ease;
    }
    .auth-submit:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(88, 198, 179, 0.40), rgba(32, 122, 110, 0.40));
      transform: translateY(-1px);
    }
    .auth-submit:disabled { opacity: 0.55; cursor: not-allowed; }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1.2rem 0;
      font-family: "Public Sans", "Source Sans 3", sans-serif;
      font-size: 0.7rem;
      color: rgba(154, 184, 189, 0.6);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(88, 198, 179, 0.18);
    }
    .auth-secondary {
      display: block;
      width: 100%;
      padding: 0.78rem 1.1rem;
      font-family: "Public Sans", "Source Sans 3", sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      background: rgba(8, 22, 32, 0.6);
      color: #e8f7f4;
      border: 1px solid rgba(88, 198, 179, 0.28);
      border-radius: 0.55rem;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .auth-secondary:hover {
      background: rgba(88, 198, 179, 0.10);
      border-color: rgba(88, 198, 179, 0.55);
    }
    .auth-msg {
      margin-top: 0.85rem;
      padding: 0.7rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .auth-msg.is-error    { background: rgba(255, 95, 95, 0.10); border: 1px solid rgba(255, 95, 95, 0.35); color: #ffb4b4; }
    .auth-msg.is-success  { background: rgba(90, 220, 170, 0.10); border: 1px solid rgba(90, 220, 170, 0.32); color: #b8f0d4; }
    .auth-msg.is-info     { background: rgba(140, 180, 240, 0.08); border: 1px solid rgba(140, 180, 240, 0.30); color: #c3d8f5; }
    .auth-foot a { color: #58c6b3; text-decoration: none; }
    .auth-foot a:hover { color: #80e4cf; text-decoration: underline; }
    .auth-back {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 1rem;
      font-family: "Public Sans", "Source Sans 3", sans-serif;
      font-size: 0.78rem;
      color: rgba(154, 184, 189, 0.85);
      text-decoration: none;
    }
    .auth-back:hover { color: #58c6b3; }
    .auth-foot {
      margin-top: 1.3rem;
      font-family: "Public Sans", "Source Sans 3", sans-serif;
      font-size: 0.78rem;
      text-align: center;
      color: rgba(154, 184, 189, 0.78);
    }
    .auth-config-warning {
      margin-bottom: 1rem;
      padding: 0.75rem 0.85rem;
      background: rgba(255, 184, 78, 0.08);
      border: 1px solid rgba(255, 184, 78, 0.35);
      border-radius: 0.5rem;
      color: #ffd591;
      font-size: 0.82rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <a class="auth-brand" href="/" aria-label="GeoID Initiative Home">
    <img class="auth-brand-icon" src="/assets/GeoID_logo_icon.png" alt="">
    <span class="auth-brand-text">
      <span class="auth-brand-wordmark">Geo<span>ID</span></span>
      <span class="auth-brand-tag">Initiative</span>
    </span>
  </a>
  <main class="auth-shell">
    <div class="auth-card" id="auth-card">
      <a href="/" class="auth-back">← Back to GeoID</a>
      <div class="auth-config-warning" id="config-warning" hidden>
        Membership backend not yet configured. Sign-in is currently a UI preview.
        Configure <code>/scripts/membership-config.js</code> to enable real auth.
      </div>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="auth-tab is-active" data-mode="signin" role="tab" aria-selected="true">Sign In</button>
        <button type="button" class="auth-tab" data-mode="signup" role="tab" aria-selected="false">Create Account</button>
      </div>

      <h1 class="auth-title" id="auth-title">Welcome back</h1>
      <p class="auth-sub" id="auth-sub">Sign in to access your GeoID membership.</p>

      <form id="auth-form" novalidate>
        <div class="auth-field">
          <label for="auth-email">Email</label>
          <input type="email" id="auth-email" name="email" autocomplete="email" required>
        </div>
        <div class="auth-field">
          <label for="auth-password">Password</label>
          <input type="password" id="auth-password" name="password" autocomplete="current-password" minlength="8" required>
        </div>
        <button type="submit" class="auth-submit" id="auth-submit">Sign In</button>
      </form>

      <div class="auth-divider">or</div>
      <button type="button" class="auth-secondary" id="auth-magic">Email me a sign-in link</button>

      <div class="auth-msg" id="auth-msg" hidden></div>

      <p class="auth-foot" id="auth-foot">
        Don't have an account yet?
        <a href="#" id="auth-toggle-foot">Create one</a>
        ·
        <a href="/membership/">View membership</a>
      </p>
    </div>
  </main>

  <script src="/scripts/membership-config.js"></script>
  <script src="/scripts/membership.js"></script>
  <script>
    (function () {
      const ready = !!window.GEOID_MEMBERSHIP_CONFIG_READY;
      const params = new URLSearchParams(window.location.search);
      const returnTo = params.get("return") || "/account/";

      const card        = document.getElementById("auth-card");
      const tabs        = card.querySelectorAll(".auth-tab");
      const title       = document.getElementById("auth-title");
      const sub         = document.getElementById("auth-sub");
      const form        = document.getElementById("auth-form");
      const emailIn     = document.getElementById("auth-email");
      const passIn      = document.getElementById("auth-password");
      const submitBtn   = document.getElementById("auth-submit");
      const magicBtn    = document.getElementById("auth-magic");
      const msg         = document.getElementById("auth-msg");
      const foot        = document.getElementById("auth-foot");
      const toggleFoot  = document.getElementById("auth-toggle-foot");
      const warning     = document.getElementById("config-warning");
      let mode = params.get("mode") === "signup" ? "signup" : "signin";

      if (!ready) warning.hidden = false;

      function setMode(next) {
        mode = next;
        const isSignup = mode === "signup";
        tabs.forEach((t) => {
          const active = t.dataset.mode === mode;
          t.classList.toggle("is-active", active);
          t.setAttribute("aria-selected", active ? "true" : "false");
        });
        title.textContent = isSignup ? "Create your account" : "Welcome back";
        sub.textContent   = isSignup
          ? "Set up a GeoID account, then subscribe to unlock the full Explorer."
          : "Sign in to access your GeoID membership.";
        submitBtn.textContent = isSignup ? "Create Account" : "Sign In";
        passIn.setAttribute("autocomplete", isSignup ? "new-password" : "current-password");
        foot.innerHTML = isSignup
          ? `Already have an account? <a href="#" id="auth-toggle-foot">Sign in</a> · <a href="/membership/">View membership</a>`
          : `Don't have an account yet? <a href="#" id="auth-toggle-foot">Create one</a> · <a href="/membership/">View membership</a>`;
        document.getElementById("auth-toggle-foot")?.addEventListener("click", (e) => {
          e.preventDefault();
          setMode(mode === "signup" ? "signin" : "signup");
        });
        hideMsg();
      }

      function showMsg(text, kind) {
        msg.hidden = false;
        msg.className = "auth-msg is-" + (kind || "info");
        msg.textContent = text;
      }
      function hideMsg() { msg.hidden = true; msg.textContent = ""; }

      tabs.forEach((t) => t.addEventListener("click", () => setMode(t.dataset.mode)));
      setMode(mode);

      // Already signed in? Skip the form and forward to the return target.
      (async () => {
        if (!ready) return;
        const session = await window.GeoIDAuth.getSession();
        if (session?.user) {
          window.location.replace(returnTo);
        }
      })();

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!ready) { showMsg("Auth backend is not configured yet (see /scripts/membership-config.js).", "info"); return; }
        const email = emailIn.value.trim();
        const password = passIn.value;
        if (!email || !password) return;
        submitBtn.disabled = true;
        hideMsg();
        try {
          if (mode === "signup") {
            const { data, error } = await window.GeoIDAuth.signUp({
              email, password,
              redirectTo: window.location.origin + "/account/",
            });
            if (error) throw error;
            if (data?.user && !data.session) {
              showMsg("Check your email to confirm your address. You can subscribe once confirmed.", "success");
            } else {
              window.location.replace("/membership/");
            }
          } else {
            const { error } = await window.GeoIDAuth.signInWithPassword({ email, password });
            if (error) throw error;
            window.location.replace(returnTo);
          }
        } catch (err) {
          showMsg(err?.message || "Sign-in failed.", "error");
        } finally {
          submitBtn.disabled = false;
        }
      });

      magicBtn.addEventListener("click", async () => {
        if (!ready) { showMsg("Auth backend is not configured yet (see /scripts/membership-config.js).", "info"); return; }
        const email = emailIn.value.trim();
        if (!email) { showMsg("Enter your email above first, then press this button.", "info"); return; }
        magicBtn.disabled = true;
        try {
          const { error } = await window.GeoIDAuth.signInWithMagicLink({
            email,
            redirectTo: window.location.origin + returnTo,
          });
          if (error) throw error;
          showMsg("Sign-in link sent. Check your email.", "success");
        } catch (err) {
          showMsg(err?.message || "Could not send sign-in link.", "error");
        } finally {
          magicBtn.disabled = false;
        }
      });
    })();
  </script>
  <script src="/styles/nav.js" defer></script>
</body>
</html>
