# The membership service. Deploy from this directory with `npx wrangler deploy`.
#
# Nothing secret is in this file. The provider credentials (GOOGLE_*, GITHUB_*,
# MS_*), the mail key (RESEND_API_KEY), the Stripe secret and the signing key
# are set with `wrangler secret put`, which keeps them in the Worker's own
# environment where no page can reach them.

name = "geoid-auth"
main = "worker.js"
compatibility_date = "2026-01-01"

# The service's own origin, and the site's. SELF_ORIGIN must match the redirect
# URI registered with Google and GitHub exactly, or the sign-in is refused by
# them rather than by us.
[vars]
SELF_ORIGIN = "https://auth.geoidinitiative.com"
SITE_ORIGIN = "https://geoidinitiative.com"
# The sender of the one-time sign-in links, on a domain verified with the mail
# service (see the README). Without MAIL_FROM and RESEND_API_KEY the email
# door answers "not set up" and the three providers remain.
MAIL_FROM = "GeoID <sign-in@geoidinitiative.com>"
# Every origin a sign-in may return to, and the only ones CORS answers for.
# An open redirect is a phishing gift, so this list is the whole allowance --
# localhost is here so the site can be worked on, and is the first thing to
# take out if that ever stops being true.
RETURN_ORIGINS = "https://geoidinitiative.com https://www.geoidinitiative.com http://localhost:8125"

# A CLIENT ID IS PUBLIC AND A CLIENT SECRET IS NOT, which is why the pair is
# split across two places. The id travels in the sign-in URL for anyone to
# read, so it belongs here in plain sight; the secret goes in with
# `wrangler secret put` and never touches this file or this repository.
#
# The Worker reads all three ids. Leave a provider's id empty and its door is
# simply not offered -- so the smallest useful deploy is Google alone, and
# GitHub and Microsoft can be filled in later with no migration.
#
# In each provider's console the redirect URI must be SELF_ORIGIN +
# /auth/callback/<provider>, exactly:
#   https://auth.geoidinitiative.com/auth/callback/google
GOOGLE_CLIENT_ID = "473900633008-n15n9va0orhq6v0f5g83bjbeq6r6jhh9.apps.googleusercontent.com"
GITHUB_CLIENT_ID = ""
MS_CLIENT_ID = ""

# Sign-ins allowed per minute per address, before the KV counter refuses.
RATE_PER_MIN = "10"

# Stripe writes this list through POST /stripe/webhook, signed with the
# endpoint's secret: `npx wrangler secret put STRIPE_WEBHOOK_SECRET` (the
# whsec_… value Stripe shows when the endpoint is created). Without it the
# route answers 503 and members are added by hand, as below.
#
# One entry per member: key `member:<verified email>`, value {"until": <epoch s>}.
# An address that is not here is an explorer, which is a welcome state.
[[kv_namespaces]]
binding = "MEMBERS"
id = "REPLACE-WITH-YOUR-KV-NAMESPACE-ID"

[[routes]]
pattern = "auth.geoidinitiative.com/*"
zone_name = "geoidinitiative.com"
