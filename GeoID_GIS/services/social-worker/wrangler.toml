# GeoHUB Social. Deploy from this directory with `npx wrangler deploy`.
# Setup, once (see README.md):
#   npx wrangler d1 create geoid-social          -> paste the id below
#   npx wrangler r2 bucket create geoid-social-media
#   npx wrangler secret put SOCIAL_JWT_SECRET     -> the SAME value on geoid-auth
#   npx wrangler d1 migrations apply geoid-social --remote

name = "geoid-social"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
SELF_ORIGIN = "https://social.geoidinitiative.com"
SITE_ORIGIN = "https://geoidinitiative.com"
# The only origins CORS answers for. localhost is here so the site can be
# worked on; take it out if that stops being true.
RETURN_ORIGINS = "https://geoidinitiative.com https://www.geoidinitiative.com http://localhost:8125"
# Comma-separated emails with moderator-of-everything rights. Never shown.
ADMINS = "geoid.initiative@gmail.com"
WRITES_PER_MIN = "30"
# "1" only for `wrangler dev`: honours X-Dev-User at localhost and nowhere else.
DEV_AUTH = "0"

[[d1_databases]]
binding = "DB"
database_name = "geoid-social"
database_id = "5b1bec53-2721-4e29-814b-0e871144bde6"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "geoid-social-media"

[[routes]]
pattern = "social.geoidinitiative.com"
custom_domain = true

# Local development: `npx wrangler dev --var DEV_AUTH:1` serves on :8790 with
# a local D1 and R2; apply migrations with --local first.
