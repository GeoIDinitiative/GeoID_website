<!--
  The GIS shell, shared by every world.

  Extracted from the Earth page so the panels exist once instead of ten
  times. gis/shell.js fetches this and injects each block into whichever page
  is missing it, which is how a planet viewer gets the toolbox, the layer box,
  the Meshing Studio and the Research Hub without carrying a copy of their
  markup.

  Each block is a <template> named by data-slot; shell.js reads that rather
  than guessing from the markup.
-->
<template data-slot="project-button"><button type="button" id="project-open-modal" class="eyebrow-project"
  title="Projects" aria-label="Projects" aria-haspopup="dialog">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 4.2h4.2l1.2 1.5h5.8v6.8H2.4Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
</button></template>

<template data-slot="project-dialog"><div class="project-dialog-backdrop" id="project-dialog" hidden>
  <section class="project-dialog" role="dialog" aria-modal="true" aria-labelledby="project-dialog-title">
    <header class="project-dialog-head">
      <h2 id="project-dialog-title">Project</h2>
      <button type="button" id="project-dialog-close" class="project-dialog-close" aria-label="Close">&times;</button>
    </header>
    <div class="project-dialog-body" id="project-dialog-body"></div>
  </section>
</div></template>

<template data-slot="mode-switch"><div class="view-mode-switch" id="view-mode-switch" role="group" aria-label="View mode">
        <button type="button" class="view-mode-btn is-active" data-mode="gis" id="view-mode-gis">GIS</button>
        <button type="button" class="view-mode-btn" data-mode="model" id="view-mode-model">Model</button>
        <button type="button" class="view-mode-btn" data-mode="research" id="view-mode-research">Research</button>
      </div></template>

<template data-slot="geoid-group"><details id="geoid-controls-group" class="control-section toolbox-group" hidden>
      <summary class="section-toggle">
        <div class="section-toggle-main">
          <div class="section-heading">
            <div class="section-title"><span class="section-title-row"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2.9 8h10.2M8 2.8c1.5 1.6 1.5 8.8 0 10.4-1.5-1.6-1.5-8.8 0-10.4Z" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></span><span>Explorer</span></span></div>
          </div>
        </div>
      </summary>
      <div class="section-body toolbox-group-body" id="geoid-controls-host"></div>
    </details></template>

<template data-slot="toolbox"><div id="gis-toolbox-panels" hidden>
      <!-- The GIS panels are rendered here by gis/panels.js — ONE source for
           Earth and the nine planet pages. See that module for why. -->
      <div id="gis-panel-host"></div>

    </div></template>

<template data-slot="layer-dock"><section id="layer-dock" hidden>
      <header class="section-toggle layer-dock-head" role="button" tabindex="0"
        aria-controls="layer-dock-body" aria-expanded="true">
        <div class="section-title"><span class="section-title-row"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 2.4 14 5.5 8 8.6 2 5.5Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="m2 8.4 6 3.1 6-3.1M2 11.2l6 3.1 6-3.1" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg></span><span>Layer Visibility</span></span></div>
      </header>
      <div class="layer-dock-body" id="layer-dock-body"></div>
    </section></template>

<template data-slot="research-hub"><section id="research-hub" hidden>
    <!-- Laid out as the Qt Research Hub is (app_qt.py: AtlasRail +
         WorkspaceShell): a glyph rail down the left, one shell row carrying the
         page tabs, the page filter, the Atlas project chip and the shell
         actions, then the page itself. Rail and tabs are drawn by hub.js. -->
    <nav class="atlas-rail" id="research-rail" aria-label="Pipeline stages">
      <img class="atlas-rail-logo" src="/assets/GeoID_logo_icon.png" alt=""
        title="GeoID: Research Hub — a facet of the Atlas GIS ecosystem">
      <div class="atlas-rail-buttons" id="research-rail-buttons"></div>
    </nav>
    <div class="research-main">
      <div class="workspace-shell">
        <div class="shell-tabs" id="research-tabs" role="tablist"></div>
        <div class="shell-actions">
          <input type="search" class="shell-filter" id="research-filter"
            placeholder="Filter pages…" aria-label="Filter pages">
          <span class="atlas-chip" id="research-project">No project open</span>
          <span id="research-mode-slot"></span>
          <button type="button" class="shell-action" id="research-act-jobs"
            data-drawer="jobs" aria-pressed="false">Jobs</button>
          <button type="button" class="shell-action" id="research-act-alerts"
            data-drawer="alerts" aria-pressed="false">Alerts</button>
          <button type="button" class="shell-action" id="research-act-notes"
            data-drawer="notes" aria-pressed="false">+ New Note</button>
          <button type="button" class="shell-action" id="research-act-copilot"
            data-drawer="copilot" aria-pressed="false">Atlas</button>
          <button type="button" class="shell-action" id="research-act-shelf"
            data-drawer="shelf" aria-pressed="false">Data Shelf</button>
        </div>
      </div>
      <div class="research-page" id="research-page"></div>
      <div class="shell-drawer" id="research-drawer" hidden></div>
    </div>
  </section></template>

<template data-slot="model-studio"><section id="model-studio" hidden>
    <!-- The mode switcher is moved in here while the studio is open, so GeoID
         and GIS stay one click away instead of being hidden with the sidebar.
         Top-left, where it sits on the GeoHUB page. -->
    <div class="studio-modebar">
      <span class="studio-modebar-label">MESHING STUDIO</span>
      <span id="studio-mode-slot"></span>
      <span class="studio-status" id="studio-status"></span>
    </div>

    <div class="studio-toolbars">
    <div class="studio-toolbar" id="studio-toolbar-main">
      <button class="studio-btn" data-act="new" title="Clear the model and start over">New</button>
      <button class="studio-btn" data-act="open" title="Open a studio project (.msproj.json)">Open</button>
      <button class="studio-btn" data-act="save" title="Save the project (full edit history)">Save</button>
      <span class="studio-sep"></span>
      <button class="studio-btn" data-act="undo">Undo</button>
      <button class="studio-btn" data-act="redo">Redo</button>
      <span class="studio-sep"></span>
      <button class="studio-btn" data-act="import-cad" title="STL / MSH / OBJ / PLY via merge">Import CAD&hellip;</button>
      <button class="studio-btn" data-act="import-xyz" title="Point data to terrain surface or solid volume">Import XYZ&hellip;</button>
      <span class="studio-sep"></span>
      <button class="studio-btn" data-act="fuse" title="Fuse: first entity is the object, the rest are tools">Fuse</button>
      <button class="studio-btn" data-act="cut" title="Cut: subtract the tools from the object">Cut</button>
      <button class="studio-btn" data-act="intersect" title="Intersect the selection">Intersect</button>
      <button class="studio-btn" data-act="fragment" title="Fragment: split at shared interfaces">Fragment</button>
      <button class="studio-btn" data-act="transform" title="Translate / rotate / scale the selection">Transform&hellip;</button>
      <button class="studio-btn" data-act="delete">Delete</button>
      <span class="studio-sep"></span>
      <button class="studio-btn" data-act="export-script" title="Write the model as a standalone gmsh Python script">Export script</button>
      <button class="studio-btn" data-act="mesh-gmsh" title="Run the model through gmsh in the local sidecar; the mesh lands in the project's meshes/">Mesh with gmsh</button>
      <button class="studio-btn" data-act="to-gales" title="Export MSH 2.2 for the GALES tree">To GALES</button>
      <button class="studio-btn" data-act="to-explorer" title="Export the meshed surface into the Earth viewer with a lat/lon manifest">To Explorer</button>
      <button class="studio-btn" data-act="save-template" title="Save this model's op history as a reusable template">Save as template</button>
      <button class="studio-btn" data-act="snapshot" title="Save a PNG of the viewport">Snapshot</button>
      <span class="studio-sep"></span>
      <input id="studio-ai" class="studio-ai" type="text"
             placeholder="Tell Atlas what to build&hellip;  (e.g. 'volcano with a chamber at 4 km, mesh at 500 m')">
    </div>

    <div class="studio-toolbar" id="studio-toolbar-view">
      <span class="studio-label">Pick:</span>
      <select id="studio-pick" class="studio-select">
        <option>Surfaces</option><option>Volumes</option><option>Curves</option>
      </select>
      <button class="studio-btn is-toggle is-on" data-toggle="edges">Edges</button>
      <button class="studio-btn is-toggle" data-toggle="wireframe">Wireframe</button>
      <button class="studio-btn is-toggle" data-toggle="gizmo" title="Drag-to-move/scale the selection">Gizmo</button>
      <button class="studio-btn is-toggle" data-toggle="stars" title="Starfield backdrop">Stars</button>
      <button class="studio-btn is-toggle is-on" data-toggle="ground" title="Earth-radius ground surface tangent to z = 0">Ground</button>
      <span class="studio-sep"></span>
      <button class="studio-btn" data-view="fit">Fit</button>
      <button class="studio-btn" data-view="x">X</button>
      <button class="studio-btn" data-view="y">Y</button>
      <button class="studio-btn" data-view="z">Z</button>
      <button class="studio-btn" data-view="iso">Iso</button>
      <span class="studio-sep"></span>
      <button class="studio-btn is-toggle" data-toggle="clip" title="Cutaway view of the volume mesh">Clip</button>
      <select id="studio-clip-axis" class="studio-select">
        <option>x</option><option>y</option><option>z</option>
      </select>
      <input id="studio-clip" class="studio-clip" type="range" min="0" max="100" value="50">
    </div>
    </div>

    <div class="studio-dock studio-dock-left">
      <div class="studio-tabs" data-deck="left">
        <button class="studio-tab is-active" data-tab="add">Add</button>
        <button class="studio-tab" data-tab="model">Model</button>
        <button class="studio-tab" data-tab="label">Label</button>
        <button class="studio-tab" data-tab="history">History</button>
      </div>
      <div class="studio-pane is-active" data-pane="add">
        <p class="studio-group-title">Templates (whole scenarios)</p>
        <div id="studio-templates" class="studio-palette"></div>
        <p class="studio-group-title">Primitives</p>
        <div id="studio-palette" class="studio-palette"></div>
        <p class="studio-group-title">Parameters</p>
        <div id="studio-params" class="studio-params"></div>
        <button id="studio-add" class="studio-primary" type="button">Add to model</button>
      </div>
      <div class="studio-pane" data-pane="model">
        <p class="studio-group-title">Origin (WGS84)</p>
        <div class="studio-row"><label for="studio-origin-lat">Latitude</label>
          <input id="studio-origin-lat" class="studio-input" type="number" step="any" value="0"></div>
        <div class="studio-row"><label for="studio-origin-lon">Longitude</label>
          <input id="studio-origin-lon" class="studio-input" type="number" step="any" value="0"></div>
        <div class="studio-row"><label for="studio-origin-elev">Elevation</label>
          <input id="studio-origin-elev" class="studio-input" type="number" step="any" value="0"></div>
        <button id="studio-origin-apply" class="studio-secondary" type="button">Anchor model here</button>
        <div id="studio-origin-note" class="studio-readout">Model x/y/z stay local metres about this point.</div>
        <p class="studio-group-title">Info</p>
        <div id="studio-info" class="studio-readout">Empty model.</div>
        <p class="studio-group-title">Entities</p>
        <div id="studio-entities" class="studio-list"></div>
        <p class="studio-group-title">Physical groups</p>
        <div id="studio-groups" class="studio-list"></div>
      </div>
      <div class="studio-pane" data-pane="label">
        <div id="studio-selection" class="studio-readout">Nothing selected</div>
        <div class="studio-row"><label for="studio-label-name">Name</label>
          <input id="studio-label-name" class="studio-input" type="text" placeholder="group name"></div>
        <button id="studio-label-apply" class="studio-primary" type="button">Label selection</button>
        <p class="studio-group-title">Refine near selection</p>
        <div class="studio-row"><label for="studio-size-min">SizeMin</label>
          <input id="studio-size-min" class="studio-input" type="number" step="any" value="0.25"></div>
        <div class="studio-row"><label for="studio-size-max">SizeMax</label>
          <input id="studio-size-max" class="studio-input" type="number" step="any" value="1"></div>
        <button id="studio-refine-sel" class="studio-secondary" type="button">Refine near selection&hellip;</button>
      </div>
      <div class="studio-pane" data-pane="history">
        <div id="studio-history" class="studio-list"></div>
      </div>
    </div>

    <div class="studio-dock studio-dock-right">
      <div class="studio-tabs" data-deck="right">
        <button class="studio-tab is-active" data-tab="mesh">Mesh</button>
        <button class="studio-tab" data-tab="structured">Structured</button>
        <button class="studio-tab" data-tab="refine">Refine</button>
        <button class="studio-tab" data-tab="log">Log</button>
      </div>
      <div class="studio-pane is-active" data-pane="mesh">
        <p class="studio-group-title">Mesh settings</p>
        <div class="studio-row"><label for="studio-alg2">2D algorithm</label>
          <select id="studio-alg2" class="studio-select wide"><option>auto</option><option>MeshAdapt</option><option>Delaunay</option><option>Frontal-Delaunay</option></select></div>
        <div class="studio-row"><label for="studio-alg3">3D algorithm</label>
          <select id="studio-alg3" class="studio-select wide"><option>auto</option><option>Delaunay</option><option>HXT</option><option>Lattice</option></select></div>
        <div class="studio-row"><label for="studio-order">Element order</label>
          <select id="studio-order" class="studio-select wide"><option>1</option><option>2</option></select></div>
        <div class="studio-row"><label for="studio-size-lo">Size min</label>
          <input id="studio-size-lo" class="studio-input" type="number" step="any" value="0.5"></div>
        <div class="studio-row"><label for="studio-size-hi">Size max</label>
          <input id="studio-size-hi" class="studio-input" type="number" step="any" value="1"></div>
        <button id="studio-suggest" class="studio-secondary" type="button">Suggest</button>
        <label class="studio-check"><input id="studio-optimize" type="checkbox"> Optimize (tet quality pass)</label>
        <div class="studio-actions">
          <button id="studio-mesh1d" class="studio-secondary" type="button">Mesh 1D</button>
          <button id="studio-mesh2d" class="studio-secondary" type="button">Mesh 2D</button>
          <button id="studio-mesh3d" class="studio-primary" type="button">Mesh 3D</button>
        </div>
        <button id="studio-clear-mesh" class="studio-secondary" type="button">Clear mesh</button>
        <div id="studio-mesh-info" class="studio-readout">No mesh.</div>
        <canvas id="studio-quality" class="studio-canvas" width="240" height="80" hidden></canvas>
        <p class="studio-group-title">Export mesh</p>
        <div class="studio-actions">
          <button id="studio-exp-msh" class="studio-secondary" type="button" disabled>.msh</button>
          <button id="studio-exp-stl" class="studio-secondary" type="button" disabled>STL</button>
          <button id="studio-exp-obj" class="studio-secondary" type="button" disabled>OBJ</button>
          <button id="studio-exp-ply" class="studio-secondary" type="button" disabled>PLY</button>
        </div>
      </div>
      <div class="studio-pane" data-pane="structured">
        <p class="studio-group-title">Transfinite curves</p>
        <div class="studio-row"><label for="studio-tf-nodes">Nodes</label>
          <input id="studio-tf-nodes" class="studio-input" type="number" value="10"></div>
        <label class="studio-check"><input id="studio-recombine" type="checkbox"> Recombine to quads</label>
        <button id="studio-tf-surfaces" class="studio-secondary" type="button">Transfinite surfaces</button>
        <button id="studio-tf-volumes" class="studio-secondary" type="button">Transfinite volumes</button>
        <button id="studio-tf-auto" class="studio-primary" type="button">Auto transfinite (whole model)</button>
        <button id="studio-recombine-sel" class="studio-secondary" type="button">Recombine selected surfaces</button>
        <div id="studio-structured-info" class="studio-readout">Structured meshing controls the lattice directly.</div>
      </div>
      <div class="studio-pane" data-pane="refine">
        <div class="studio-actions">
          <button id="studio-field-add" class="studio-primary" type="button">Add field</button>
          <button id="studio-field-remove" class="studio-secondary" type="button">Remove selected field</button>
        </div>
        <div class="studio-row"><label for="studio-field-type">Type</label>
          <select id="studio-field-type" class="studio-select wide">
            <option value="ball">Ball</option>
            <option value="box">Box</option>
            <option value="distance">Distance</option>
            <option value="threshold">Threshold</option>
          </select></div>
        <div class="studio-row"><label for="studio-field-x">X</label><input id="studio-field-x" class="studio-input" type="number" step="any" value="0"></div>
        <div class="studio-row"><label for="studio-field-y">Y</label><input id="studio-field-y" class="studio-input" type="number" step="any" value="0"></div>
        <div class="studio-row"><label for="studio-field-z">Z</label><input id="studio-field-z" class="studio-input" type="number" step="any" value="0"></div>
        <div class="studio-row"><label for="studio-field-r">Radius</label><input id="studio-field-r" class="studio-input" type="number" step="any" value="2"></div>
        <div class="studio-row"><label for="studio-field-dmin">DistMin</label><input id="studio-field-dmin" class="studio-input" type="number" step="any" value="0.25"></div>
        <div class="studio-row"><label for="studio-field-dmax">DistMax</label><input id="studio-field-dmax" class="studio-input" type="number" step="any" value="1"></div>
        <div id="studio-fields" class="studio-list"></div>
      </div>
      <div class="studio-pane" data-pane="log">
        <div id="studio-log" class="studio-log"></div>
      </div>
    </div>
  </section></template>
