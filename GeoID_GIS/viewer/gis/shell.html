<!--
  The GIS shell, shared by every world.

  Extracted from the Earth page so the panels exist once instead of ten
  times. gis/shell.js fetches this and injects each block into whichever page
  is missing it, which is how a planet viewer gets the toolbox, the layer box,
  the Meshing Studio and the Research Hub without carrying a copy of their
  markup.

  Each block is a <template> named by data-slot; shell.js reads that rather
  than guessing from the markup.
-->

</button></template>

          <button class="studio-btn" data-act="mesh-gmsh" title="Run the model through gmsh in the local sidecar; the mesh lands in the project's meshes/">Mesh with gmsh</button>

      <button class="studio-btn is-toggle" data-toggle="wireframe">Wire</button>

    </div>
