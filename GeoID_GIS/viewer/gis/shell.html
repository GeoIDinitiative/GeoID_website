<!--
  The GIS shell, shared by every world.

  Extracted from the Earth page so the panels exist once instead of ten
  times. gis/shell.js fetches this and injects each block into whichever page
  is missing it, which is how a planet viewer gets the toolbox, the layer box,
  the Meshing Studio and the Research Hub without carrying a copy of their
  markup.

  Each block is a <template> named by data-slot; shell.js reads that rather
  than guessing from the markup.
-->
<template data-slot="project-button"><button type="button" id="project-open-modal" class="eyebrow-project"
  title="Projects" aria-label="Projects" aria-haspopup="dialog">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 4.2h4.2l1.2 1.5h5.8v6.8H2.4Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
</button></template>

<template data-slot="project-dialog"><div class="project-dialog-backdrop" id="project-dialog" hidden>
  <section class="project-dialog" role="dialog" aria-modal="true" aria-labelledby="project-dialog-title">
    <header class="project-dialog-head">
      <h2 id="project-dialog-title">Project</h2>
      <button type="button" id="project-dialog-close" class="project-dialog-close" aria-label="Close">&times;</button>
    </header>
    <div class="project-dialog-body" id="project-dialog-body"></div>
  </section>
</div></template>

<template data-slot="mode-switch"><div class="view-mode-switch" id="view-mode-switch" role="group" aria-label="View mode">
        <button type="button" class="view-mode-btn is-active" data-mode="gis" id="view-mode-gis">GIS</button>
        <button type="button" class="view-mode-btn" data-mode="model" id="view-mode-model">Model</button>
        <button type="button" class="view-mode-btn" data-mode="research" id="view-mode-research">Research</button>
      </div></template>

<template data-slot="geoid-group"><details id="geoid-controls-group" class="control-section toolbox-group" hidden>
      <summary class="section-toggle">
        <div class="section-toggle-main">
          <div class="section-heading">
            <div class="section-title"><span class="section-title-row"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.2" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2.9 8h10.2M8 2.8c1.5 1.6 1.5 8.8 0 10.4-1.5-1.6-1.5-8.8 0-10.4Z" fill="none" stroke="currentColor" stroke-width="1.1"/></svg></span><span>Explorer</span></span></div>
          </div>
        </div>
      </summary>
      <div class="section-body toolbox-group-body" id="geoid-controls-host"></div>
    </details></template>

<template data-slot="toolbox"><div id="gis-toolbox-panels" hidden>
      <details id="gis-group-modelled" class="control-section toolbox-group">
        <summary class="section-toggle">
          <div class="section-toggle-main">
            <div class="section-heading">
              <div class="section-title"><span class="section-title-row"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2.6 11.4 6 7.6l2.6 2.3L13.4 4.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.6 13.4h10.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></span><span>Earth Engine</span></span></div>
            </div>
          </div>
        </summary>
        <div class="section-body toolbox-group-body">
          <details class="gis-tool-section">
            <summary>Earth Engine Catalogue</summary>
            <div class="gis-tool-body">
              <label class="row"><span>Dataset</span>
                <select id="gee-dataset" class="input">
                  <option value="">Select a collection…</option>
                  <option value="COPERNICUS/S2_SR_HARMONIZED">Sentinel-2 surface reflectance</option>
                  <option value="LANDSAT/LC09/C02/T1_L2">Landsat 9 surface reflectance</option>
                  <option value="COPERNICUS/S1_GRD">Sentinel-1 SAR (GRD)</option>
                  <option value="NASA/NASADEM_HGT/001">NASADEM elevation</option>
                  <option value="COPERNICUS/DEM/GLO30">Copernicus GLO-30 DEM</option>
                  <option value="MODIS/061/MOD11A1">MODIS land surface temperature</option>
                  <option value="UCSB-CHG/CHIRPS/DAILY">CHIRPS daily precipitation</option>
                </select>
              </label>
              <div class="row"><span>Date range</span>
                <span class="gee-dates">
                  <input id="gee-date-from" class="input" type="date" title="From">
                  <span class="gee-dates-sep">–</span>
                  <input id="gee-date-to" class="input" type="date" title="To">
                </span>
              </div>
              <label class="row"><span>Extent</span>
                <select id="gee-extent" class="input">
                  <option value="global" selected>Global</option>
                  <option value="view">Current view</option>
                  <option value="polygon">Drawn polygon</option>
                </select>
              </label>
              <div class="row"><label for="gee-res">Detail</label><select id="gee-res" class="mini-select"><option value="auto" selected>Auto (fit extent)</option><option value="512">512 px</option><option value="1024">1024 px</option><option value="2048">2048 px</option></select></div>
              <button id="gee-request" class="button" type="button">Request basemap</button>
              <p id="gee-status" class="gis-hint" aria-live="polite"></p>
            </div>
          </details>
          <details class="gis-tool-section">
            <summary>Service</summary>
            <div class="gis-tool-body">
              <p class="gis-hint">Earth Engine cannot be called from a page directly:
                it needs a credential, and anything the browser holds is public. A
                small service holds it instead. See services/gee-tiles.</p>
              <label class="row"><span>Endpoint</span>
                <input id="gee-endpoint" class="input" type="url"
                  placeholder="https://region-project.cloudfunctions.net/geeImage"></label>
              <button id="gee-endpoint-save" class="button secondary" type="button">Save endpoint</button>
            </div>
          </details>
        </div>
      </details>
      <details id="gis-group-import" class="control-section toolbox-group">
        <summary class="section-toggle">
          <div class="section-toggle-main">
            <div class="section-heading">
              <div class="section-title"><span class="section-title-row"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 2.9v7.2M5.2 7.4 8 10.2l2.8-2.8" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M3.2 12.4h9.6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg></span><span>Add / Import Data</span></span></div>
            </div>
          </div>
        </summary>
        <div class="section-body toolbox-group-body">
          <div id="import-tools-host"></div>
          <details class="gis-tool-section">
            <summary>Coordinate Transformer</summary>
            <div class="gis-tool-body">
              <p class="tool-copy">Convert a coordinate pair between reference systems.</p>
              <div class="row"><label for="crs-from">From</label><select id="crs-from" class="mini-select"></select></div>
              <div class="gis-tool-grid">
                <input id="crs-in-x" class="input" type="number" step="any" placeholder="X / lon">
                <input id="crs-in-y" class="input" type="number" step="any" placeholder="Y / lat">
              </div>
              <div class="row"><label for="crs-to">To</label><select id="crs-to" class="mini-select"></select></div>
              <button id="crs-convert" class="tool-button" type="button">Convert</button>
              <div id="crs-result" class="gis-metric">Enter a coordinate to convert.</div>
              <button id="crs-use-view" class="button secondary" type="button">Use current view centre</button>
            </div>
          </details>
        </div>
      </details>
      <details id="gis-group-polygons" class="control-section toolbox-group">
        <summary class="section-toggle">
          <div class="section-toggle-main">
            <div class="section-heading">
              <div class="section-title"><span class="section-title-row"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2.6 6.1 7 2.4l6.4 2.5-1.5 6.2-5.6 2.5-3.9-3.3Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="7" cy="2.4" r="1" fill="currentColor"/><circle cx="13.4" cy="4.9" r="1" fill="currentColor"/><circle cx="2.6" cy="6.1" r="1" fill="currentColor"/><circle cx="6.3" cy="13.6" r="1" fill="currentColor"/></svg></span><span>Shapefiles</span></span></div>
            </div>
          </div>
        </summary>
        <div class="section-body">
          <div class="control-stack">
            <div class="section-summary-copy" style="margin-bottom:0.5rem;">Shapefile and vector overlays — coastlines, boundaries, basins. Switch one off to take it off the globe without unloading it.</div>
            <div class="gis-btn-row">
              <button id="polygon-browse" class="button" type="button">Add shapefile</button>
            </div>
            <input id="polygon-file" type="file" multiple hidden>
            <div id="polygon-list" class="polygon-list"></div>
          </div>
        </div>
      </details>

      <details id="gis-group-preprocess" class="control-section toolbox-group">
        <summary class="section-toggle">
          <div class="section-toggle-main">
            <div class="section-heading">
              <div class="section-title"><span class="section-title-row"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3 4.4h10M3 8h10M3 11.6h6" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="11.6" cy="11.6" r="1.6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></span><span>Pre-processing Toolbox</span></span></div>
            </div>
          </div>
        </summary>
        <div class="section-body toolbox-group-body">
          <details class="gis-tool-section">
            <summary>Surface Analysis</summary>
            <div class="gis-tool-body">
              <div class="row"><label for="ras-op-a">Raster</label><select id="ras-op-a" class="mini-select"></select></div>
              <div class="row"><label for="ras-op">Tool</label><select id="ras-op" class="mini-select"></select></div>
                            <div class="row" id="ras-op-second-row" hidden><label for="ras-op-b">Raster B</label><select id="ras-op-b" class="mini-select"></select></div>
              <div class="row" id="ras-op-zones-row" hidden><label id="ras-op-zones-label" for="ras-op-zones">Polygons</label><select id="ras-op-zones" class="mini-select"></select></div>
              <div class="row" id="ras-op-text-row" hidden><label id="ras-op-text-label" for="ras-op-text">Expression</label><input id="ras-op-text" class="input" type="text"></div>
              <div class="row" id="ras-op-field-row" hidden><label for="ras-op-field">Attribute</label><select id="ras-op-field" class="mini-select"></select></div>
              <div class="row" id="ras-op-param-row" hidden><label id="ras-op-param-label" for="ras-op-param">Value</label><input id="ras-op-param" class="input" type="number"></div>
              <button id="ras-op-run" class="tool-button" type="button">Run</button>
              <div id="ras-op-status" class="gis-metric">Slope, aspect, hillshade, curvature, roughness, focal statistics, contours, rules reclassify, calculator, resample, distance, rasterize, point sampling, weighted overlay, clip and raster-to-points.</div>
            </div>
          </details>
          <details class="gis-tool-section">
            <summary>Zonal Statistics</summary>
            <div class="gis-tool-body">
              <div class="row"><label for="zonal-raster">Raster</label><select id="zonal-raster" class="mini-select"></select></div>
              <div class="row"><label for="zonal-zones">Zones</label><select id="zonal-zones" class="mini-select"></select></div>
              <button id="zonal-run" class="tool-button" type="button">Compute</button>
              <div id="zonal-status" class="gis-metric">Summarise raster values inside each polygon.</div>
              <button id="zonal-export" class="button secondary" type="button" disabled>Export CSV</button>
            </div>
          </details>
          <details class="gis-tool-section">
            <summary>Sample Raster At Point</summary>
            <div class="gis-tool-body">
              <div class="gis-tool-grid">
                <input id="raster-lat" class="input" type="number" step="any" placeholder="lat">
                <input id="raster-lon" class="input" type="number" step="any" placeholder="lon">
              </div>
              <button id="raster-sample" class="tool-button" type="button">Sample All Rasters</button>
              <div id="raster-sample-result" class="gis-metric">No sample taken.</div>
            </div>
          </details>
          <details class="gis-tool-section">
            <summary>Geoprocessing</summary>
            <div class="gis-tool-body">
              <div class="row"><label for="vec-op-a">Input</label><select id="vec-op-a" class="mini-select"></select></div>
              <div class="row"><label for="vec-op">Tool</label><select id="vec-op" class="mini-select"></select></div>
              <div class="row" id="vec-op-second-row" hidden><label for="vec-op-b">Overlay</label><select id="vec-op-b" class="mini-select"></select></div>
              <div class="row" id="vec-op-field-row" hidden><label for="vec-op-field">Field</label><select id="vec-op-field" class="mini-select"></select></div>
                            <div class="row" id="vec-op-crs-row" hidden><label for="vec-op-crs-from">CRS</label><select id="vec-op-crs-from" class="mini-select"></select><select id="vec-op-crs-to" class="mini-select"></select></div>
              <div class="row" id="vec-op-param-row" hidden><label id="vec-op-param-label" for="vec-op-param">Value</label><input id="vec-op-param" class="input" type="number"></div>
              <div class="row" id="vec-op-check-row" hidden><label id="vec-op-check-label" for="vec-op-check">Option</label><input id="vec-op-check" type="checkbox" checked></div>
              <button id="vec-op-run" class="tool-button" type="button">Run</button>
              <div id="vec-op-status" class="gis-metric">Buffer, clip, difference, intersect, union, dissolve, hull, centroids, simplify, reproject, spatial join.</div>
            </div>
          </details>
          <details class="gis-tool-section">
            <summary>Explore &amp; Edit</summary>
            <div class="gis-tool-body">
              <div class="measure-actions">
                <button id="open-charts" class="button secondary" type="button" title="Histogram, scatter and box plots of the selected layer">Charts</button>
                <button id="open-time" class="button secondary" type="button" title="Filter and animate a layer through its date field">Time slider</button>
              </div>
              <div class="measure-actions">
                <button id="open-edit" class="button secondary" type="button" title="Digitise and edit geometry; edits become a new layer">Edit layer</button>
                <button id="open-wfs" class="button secondary" type="button" title="Import features from a WFS or OGC API Features service">Add WFS layer</button>
              </div>
              <div id="explore-status" class="gis-metric">Charts, time filtering, geometry editing, live web-feature services, and a worked example you can load in one press.</div>
            </div>
          </details>
          <details class="gis-tool-section">
            <summary>Attribute Table</summary>
            <div class="gis-tool-body">
              <div class="row"><label for="attr-layer">Layer</label><select id="attr-layer" class="mini-select"></select></div>
              <div id="attr-table-host" class="attr-table-host"></div>
              <div class="row"><label for="attr-query">Query</label><input id="attr-query" class="input" type="text" placeholder="slope &gt; 20 AND rock contains 'mudstone'"></div>
              <div class="measure-actions">
                <button id="attr-query-run" class="button secondary" type="button">Select by query</button>
                <button id="attr-query-layer" class="button secondary" type="button">Selection to layer</button>
                <button id="attr-query-clear" class="button secondary" type="button">Clear</button>
              </div>
              <details class="gis-tool-section"><summary>Query syntax</summary><div id="attr-query-help" class="gis-tool-body"></div></details>
              <div class="row"><label for="attr-field">Field</label><select id="attr-field" class="mini-select"></select></div>
              <button id="attr-stats-run" class="button secondary" type="button">Field Statistics</button>
              <div class="gis-tool-grid">
                <input id="calc-field" class="input" type="text" placeholder="new field">
                <input id="calc-expr" class="input" type="text" placeholder="e.g. area_m2 / 1000">
              </div>
              <button id="calc-run" class="button secondary" type="button">Field Calculator</button>
              <div id="attr-stats" class="gis-metric">Select a layer to inspect its attributes.</div>
              <p class="tool-copy">Export selected layer</p>
              <div class="measure-actions">
                <button id="export-geojson" class="button secondary" type="button">GeoJSON</button>
                <button id="export-csv" class="button secondary" type="button">CSV</button>
                <button id="export-wkt" class="button secondary" type="button">WKT</button>
              </div>
              <div class="measure-actions">
                <button id="export-kml" class="button secondary" type="button">KML</button>
              </div>
            </div>
          </details>
          <details class="gis-tool-section">
            <summary>Attribute Query</summary>
            <div class="gis-tool-body">
              <div class="row"><label for="vector-layer">Layer</label><select id="vector-layer" class="mini-select"></select></div>
              <div class="row"><label for="vector-field">Field</label><select id="vector-field" class="mini-select"></select></div>
              <input id="vector-value" class="input" type="text" placeholder="Contains text (blank = all)">
              <button id="vector-query" class="tool-button" type="button">Run Query</button>
              <div id="vector-query-result" class="gis-metric">No query run.</div>
              <button id="vector-query-export" class="button secondary" type="button" disabled>Export Matches CSV</button>
            </div>
          </details>
        </div>
      </details>
      <details id="gis-group-analysis" class="control-section toolbox-group">
        <summary class="section-toggle">
          <div class="section-toggle-main">
            <div class="section-heading">
              <div class="section-title"><span class="section-title-row"><span class="section-icon" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M2.6 12.6 5.4 8l2.3 2.6L10.2 5l3.2 5.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>Extraction &amp; Analysis</span></span></div>
            </div>
          </div>
        </summary>
        <div class="section-body toolbox-group-body">
          <!-- The toolbox belongs to THIS panel. It was in Preprocess, which is
               a different button on the rail: the tools were present and
               nobody pressing Analysis would ever find them. -->
          <details class="gis-tool-section">
            <summary>Analysis tools</summary>
            <div class="gis-tool-body">
              <p class="tool-copy">Every tool, grouped. Press <strong>/</strong> to search them by name.</p>
              <div id="gis-tool-catalogue"></div>
            </div>
          </details>
          <div id="analysis-tools-host">
            <!-- The Extract From Layers panel, identical to the Earth page's.
                 toolbox.js MOVES this into the host by id, so the host was empty
                 on every planet and the Draw box and extraction simply did not
                 exist there. -->
      <details id="gis-analysis-section" class="control-section" hidden>
        <summary class="section-toggle">
          <div class="section-toggle-main">
            <div class="section-heading">
              <div class="section-title">Extract From Layers</div>
            </div>
          </div>
        </summary>
        <div class="section-body">
          <p class="tool-copy">Mark out an area — click one out with the <strong>Draw</strong> tool, or set a box below — then sample every active layer across it and export one table.</p>
          <div class="gis-draw-box">
            <div class="row">
              <label for="gis-box-shape">Shape</label>
              <select id="gis-box-shape" class="input">
                <option value="square">Square</option>
                <option value="rectangle">Rectangle</option>
              </select>
            </div>
            <div class="row">
              <label for="gis-box-width"><span id="gis-box-width-label">Side (km)</span></label>
              <input id="gis-box-width" class="input" type="number" min="0.05" step="1" value="10">
            </div>
            <div class="row" id="gis-box-height-row" hidden>
              <label for="gis-box-height">Height (km)</label>
              <input id="gis-box-height" class="input" type="number" min="0.05" step="1" value="10">
            </div>
            <div class="row">
              <label for="gis-box-centre">Centred on</label>
              <select id="gis-box-centre" class="input">
                <option value="view">The middle of the view</option>
                <option value="manual">Coordinates below</option>
              </select>
            </div>
            <div class="row" id="gis-box-manual" hidden>
              <label for="gis-box-lat">Lat / lon</label>
              <input id="gis-box-lat" class="input" type="number" step="0.0001" placeholder="lat" aria-label="Box centre latitude">
              <input id="gis-box-lon" class="input" type="number" step="0.0001" placeholder="lon °E" aria-label="Box centre longitude east">
            </div>
            <button id="gis-box-draw" class="tool-button" type="button">Draw box</button>
            <div id="gis-box-status" class="gis-metric">No box drawn.</div>
          </div>
          <div class="gis-extract-options">
            <label class="gis-extract-source" for="gis-extract-builtin">
              <input type="checkbox" id="gis-extract-builtin" checked>
              <span>GeoID DEM elevation + slope</span>
            </label>
            <label class="gis-extract-source" for="gis-extract-geology">
              <input type="checkbox" id="gis-extract-geology">
              <span>GeoID geology class (slower)</span>
            </label>
            <label class="gis-extract-source" for="gis-extract-climate">
              <input type="checkbox" id="gis-extract-climate">
              <span>Modelled climate (temperature, pressure, wind, irradiance) &mdash; estimated from latitude and elevation, not observed</span>
            </label>
          </div>
          <div id="gis-extract-sources" class="gis-extract-options">
            <p class="tool-copy import-empty-note">No sampleable imported layers.</p>
          </div>
          <div class="row">
            <label for="gis-extract-step">Sample spacing (km)</label>
            <input id="gis-extract-step" class="input" type="number" min="0.05" step="0.05" value="1">
          </div>
          <button id="gis-extract-run" class="tool-button" type="button">Run Extraction</button>
          <div id="gis-extract-status" class="gis-metric">No extraction run yet.</div>
          <div class="measure-actions">
            <button id="gis-extract-csv" class="button secondary" type="button" disabled>Export CSV</button>
            <button id="gis-extract-geojson" class="button secondary" type="button" disabled>Export GeoJSON</button>
          </div>
        </div>
      </details>
          </div>
          <details class="gis-tool-section">
            <summary>Point &amp; Pixel Extraction</summary>
            <div class="gis-tool-body">
              <label class="row"><span>Source layer</span>
                <select id="extract-source" class="input"></select>
              </label>
              <!-- Any number of points, not one pin: a transect, a set of
                   boreholes, a station network. Paste a column from a
                   spreadsheet — commas, tabs or spaces all separate. -->
              <label class="row-stack"><span>Points — one per line, <code>lat, lon</code> (height and label optional)</span>
                <textarea id="extract-points" class="input" rows="5"
                  placeholder="54.67, -6.775&#10;Station 4: 54.60, -6.30, 120&#10;54.5985 -5.9301"></textarea>
              </label>
              <div class="gis-btn-row">
                <button id="extract-pick" class="button" type="button">Pick on globe</button>
                <button id="extract-add-centre" class="button" type="button">Add view centre</button>
                <button id="extract-clear" class="button" type="button">Clear</button>
              </div>
              <button id="extract-run" class="button primary" type="button">Extract at points</button>
              <div id="extract-summary" class="gis-metric">Nothing extracted yet.</div>
              <div id="extract-table" class="gis-point-table-host"></div>
              <div class="gis-btn-row">
